# Local development infrastructure (Phase 0). The backend and frontend
# services are added to this file in Phase 9 so one command starts everything.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-eventbooking}
      POSTGRES_USER: ${DB_USERNAME:-eventbooking}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env (see .env)}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-eventbooking} -d ${DB_NAME:-eventbooking}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    # Seat locks and rate-limit counters are short-lived, so persistence is off:
    # after a Redis restart every hold simply expires, and Postgres stays correct.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
